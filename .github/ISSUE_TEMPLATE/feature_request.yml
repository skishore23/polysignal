name: Feature request
description: Propose an evidence-backed improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What measurable problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation
      description: How will the change be tested or evaluated?
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This does not silently enable live execution or weaken a promotion gate.
          required: true
